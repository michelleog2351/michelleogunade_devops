
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link rel="stylesheet" type="text/css" href="styles.css">
	<script type="text/javascript" src="src/js/login.js"></script>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" scrossorigin="anonymous"></script>

	<title>Login Page</title>
	 <script src="src/js/nav.js"></script>
    <script src="src/js/footer.js"></script>
    <script src="src/js/login.js"></script>

	    <link rel="stylesheet" type="text/css" href="src/css/style.css" />

</head>

  <body >
		<nav class="navbar navbar-expand-sm bg-dark navbar-dark" id="nav">


	</nav>

	<hr>
	<div class="row justify-content-center mt-4">
	<div class="col-md-6">
		<h1 class="text-center mb-4">Login</h1>
		<hr>

		<form id="loginForm" novalidate>

		<div class="row mb-3 align-items-center">
			<label for="userNameID" class="col-sm-4 col-form-label">
			Username	
			</label>
			<div class="col-sm-8">
			<input
				type="text"
				class="form-control"
				id="userNameID"
				name="username"
				placeholder="example@fungames.com"
				required
			/>
			</div>
		</div>

		<div class="row mb-3 align-items-center">
			<label for="passwordID" class="col-sm-4 col-form-label">
			Password
			</label>
			<div class="col-sm-8">
			<input
				type="password"
				class="form-control"
				id="passwordID"
				name="password"
				placeholder="Enter password..."
				required
			/>
			</div>
		</div>

		<button type="submit" id="loginButton" class="btn btn-primary w-100">
			Login
		</button>

		<span id="errorSpan" class="text-danger fw-semibold d-block mt-2"></span>

		</form>
	</div>
	</div>

  </div>
</body>
    <footer id="footer"></footer>

</html>
